# GitHub Action to automate the identification of common misspellings in text files.
# https://github.com/codespell-project/actions-codespell
# https://github.com/codespell-project/codespell
name: codespell (Disabled)

# Workflow disabled - uncomment 'on' section below to re-enable
# on:
#   push:
#     branches:
#       - dev
#       - main
#   pull_request:
#     branches:
#       - dev
#       - main

on:
  workflow_dispatch:  # Only allow manual triggering
jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: codespell-project/actions-codespell@master
        with:
          check_filenames: true
          skip: ./sddl/sddlPortable_test.go,./sddl/sddlHelper_linux.go,./go.sum
          ignore_words_list: "resue,pase,cancl,cacl,froms"