# GoReleaser configuration for AzCopy
# See: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  - id: azcopy
    main: ./main.go
    binary: azcopy
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Disable CGO for cross-compilation
    env:
      - CGO_ENABLED=0
    # Ignore arm64 on Windows (not commonly used)
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

archives:
  - id: azcopy-archive
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      azcopy_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}_
      {{- .Version }}
    files:
      - LICENSE
      - README.md
      - NOTICE.txt

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: "{{ .ProjectName }}"
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## AzCopy {{ .Tag }}

    This release includes binaries for Linux, Windows, and macOS (both Intel and Apple Silicon).

    ### Installation

    #### Linux
    ```bash
    wget https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/download/{{ .Tag }}/azcopy_linux_amd64_{{ .Version }}.tar.gz
    tar -xzf azcopy_linux_amd64_{{ .Version }}.tar.gz
    chmod +x azcopy
    sudo mv azcopy /usr/local/bin/
    ```

    #### macOS
    ```bash
    # For Intel Macs
    curl -L https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/download/{{ .Tag }}/azcopy_darwin_amd64_{{ .Version }}.tar.gz | tar -xz

    # For Apple Silicon (M1/M2/M3)
    curl -L https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/download/{{ .Tag }}/azcopy_darwin_arm64_{{ .Version }}.tar.gz | tar -xz

    chmod +x azcopy
    sudo mv azcopy /usr/local/bin/
    ```

    #### Windows
    Download and extract `azcopy_windows_amd64_{{ .Version }}.zip`

    ---
  footer: |
    **Full Changelog**: https://github.com/{{ .Env.GITHUB_REPOSITORY }}/compare/{{ .PreviousTag }}...{{ .Tag }}

